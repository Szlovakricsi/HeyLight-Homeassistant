name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall -q custom_components/heylight
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text())
              print(path)
          PY
      - name: Validate translation placeholders
        run: |
          python - <<'PY'
          import json
          import string
          from pathlib import Path

          formatter = string.Formatter()
          paths = [Path("custom_components/heylight/strings.json"), *Path("custom_components/heylight/translations").glob("*.json")]

          def validate(value, path, key=""):
              if isinstance(value, dict):
                  for name, child in value.items():
                      validate(child, path, f"{key}.{name}" if key else name)
              elif isinstance(value, str):
                  try:
                      list(formatter.parse(value))
                  except ValueError as exc:
                      raise ValueError(f"{path}:{key}: {exc}") from exc

          for path in paths:
              validate(json.loads(path.read_text(encoding="utf-8")), path)
          PY
      - name: Test brightness remapping
        run: python -m unittest discover -s tests -v
